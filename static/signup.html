<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Signup</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container" style="max-width: 400px; margin-top: 60px;">
    <h2>Create Admin Account</h2>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="password">

    <button onclick="signup()">Sign Up</button>
    <p id="message"></p>

    <p>Already have an account? <a href="/static/login.html">Log in</a></p>
  </main>

  <script src="/static/api.js"></script>
  <script>
    async function signup() {
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      var messageEl = document.getElementById("message");

      var response = await apiFetch("/api/admin/signup", {
        method: "POST",
        body: JSON.stringify({ email: email, password: password })
      });
      var data = await response.json();

      if (response.ok) {
        localStorage.setItem("token", data.token);
        window.location.href = "/static/dashboard.html";
      } else {
        messageEl.textContent = "Error: " + data.detail;
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Item Info</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container" style="max-width: 400px; margin-top: 40px;">
    <h2>Item Info</h2>
    <div id="content">Loading...</div>
    <p id="message"></p>
  </main>

  <script>
    var params = new URLSearchParams(window.location.search);
    var qrId = params.get("qr");

    async function loadInfo() {
      var contentDiv = document.getElementById("content");

      if (!qrId) {
        contentDiv.innerHTML = "<p>No QR code specified.</p>";
        return;
      }

      var response = await fetch("/api/lookup/" + qrId);
      var data = await response.json();

      if (!response.ok) {
        contentDiv.innerHTML = "<p>Error: " + data.detail + "</p>";
        return;
      }

      if (data.status === "unclaimed") {
        contentDiv.innerHTML =
          "<p>This sticker hasn't been used yet.</p>" +
          "<p><a role='button' href='/static/claim.html?qr=" + qrId + "'>Claim This Item</a></p>";
        return;
      }

      if (data.status === "discarded") {
        contentDiv.innerHTML = "<p>This sticker has already been used and discarded.</p>";
        return;
      }

      contentDiv.innerHTML =
        "<article>" +
        "<p><strong>Room:</strong> " + data.room_id + "</p>" +
        "<p><strong>Item:</strong> " + data.item_name + "</p>" +
        "<p><strong>Fridge:</strong> " + data.fridge_id + "</p>" +
        "<p><strong>Days stored:</strong> " + data.days_stored + "</p>" +
        "</article>" +
        "<button onclick=\"removeItem()\">Remove This Item</button>";
    }

    async function removeItem() {
      var messageEl = document.getElementById("message");

      var response = await fetch("/api/remove", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ qr_id: qrId })
      });
      var data = await response.json();

      if (response.ok) {
        messageEl.textContent = "Item removed. Thanks!";
        document.getElementById("content").innerHTML = "";
      } else {
        messageEl.textContent = "Error: " + data.detail;
      }
    }

    loadInfo();
  </script>
</body>
</html>

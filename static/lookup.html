<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Item Info</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .card p { margin: 6px 0; }
    button { margin-top: 20px; padding: 10px; width: 100%; background: #b93a3a; color: white; border: none; border-radius: 4px; font-size: 16px; }
    #message { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Item Info</h2>
  <div id="content">Loading...</div>
  <div id="message"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const qrId = params.get("qr");

    async function loadInfo() {
      const contentDiv = document.getElementById("content");

      const response = await fetch(`/api/lookup/${qrId}`);
      const data = await response.json();

      if (data.status === "unclaimed") {
        contentDiv.innerHTML = `<p>This sticker hasn't been used yet.</p>
          <p><a href="/static/claim.html?qr=${qrId}">Click here to claim it</a></p>`;
        return;
      }

      if (data.status === "discarded") {
        contentDiv.innerHTML = `<p>This sticker has already been used and discarded.</p>`;
        return;
      }

      // status === "claimed"
      contentDiv.innerHTML = `
        <div class="card">
          <p><strong>Room:</strong> ${data.room_id}</p>
          <p><strong>Item:</strong> ${data.item_name}</p>
          <p><strong>Fridge:</strong> ${data.fridge_id}</p>
          <p><strong>Days stored:</strong> ${data.days_stored}</p>
        </div>
        <button onclick="removeItem()">Remove This Item</button>
      `;
    }

    async function removeItem() {
      const messageDiv = document.getElementById("message");

      const response = await fetch("/api/remove", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ qr_id: qrId })
      });

      const data = await response.json();

      if (response.ok) {
        messageDiv.textContent = "Item removed. Thanks!";
        messageDiv.style.color = "green";
        document.getElementById("content").innerHTML = "";
      } else {
        messageDiv.textContent = "Error: " + data.detail;
        messageDiv.style.color = "red";
      }
    }

    loadInfo();
  </script>

</body>
</html>

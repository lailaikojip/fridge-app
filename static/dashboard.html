<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>Fridge App</strong></li></ul>
      <ul><li><a href="#" onclick="logout()">Logout</a></li></ul>
    </nav>

    <h2>Create New Environment</h2>
    <label for="envName">Environment Name</label>
    <input type="text" id="envName" placeholder="e.g. HSBC Office Pantry">

    <label for="threshold">Notification threshold (days)</label>
    <input type="number" id="threshold" value="30">

    <button onclick="createEnvironment()">Create</button>
    <p id="createMessage"></p>

    <hr>
    <p><em>After creating an environment, note its ID shown above to use on other pages.</em></p>
  </main>

  <script src="/static/api.js"></script>
  <script>
    requireLogin();

    async function createEnvironment() {
      var name = document.getElementById("envName").value.trim();
      var threshold = parseInt(document.getElementById("threshold").value);
      var messageEl = document.getElementById("createMessage");

      var response = await apiFetch("/api/environments/create", {
        method: "POST",
        body: JSON.stringify({ name: name, notification_threshold_days: threshold })
      });
      var data = await response.json();

      if (response.ok) {
        messageEl.textContent = "Created! Environment ID: " + data.environment_id;
        localStorage.setItem("environment_id", data.environment_id);
      } else {
        messageEl.textContent = "Error: " + data.detail;
      }
    }
  </script>
</body>
</html>

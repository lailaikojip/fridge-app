<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fridge Ranking</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; max-width: 600px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
    th { background-color: #f0f0f0; }
    select { margin-bottom: 16px; padding: 6px; }
  </style>
</head>
<body>

  <h2>Fridge Full Ranking</h2>

  <label for="fridgeSelect">Select Fridge:</label>
  <select id="fridgeSelect">
    <option value="1">Fridge 1</option>
    <option value="2">Fridge 2</option>
  </select>

  <table id="rankingTable">
    <thead>
      <tr>
        <th>Room ID</th>
        <th>Item Count</th>
        <th>Total Days</th>
        <th>Point</th>
      </tr>
    </thead>
    <tbody id="rankingBody">
      <!-- rows get filled in by JavaScript -->
    </tbody>
  </table>

  <script>
    async function loadRanking(fridgeId) {
      const response = await fetch(`/api/fridge-full-ranking?fridge_id=${fridgeId}`);
      const data = await response.json();

      const tbody = document.getElementById("rankingBody");
      tbody.innerHTML = ""; // clear old rows

      data.ranking.forEach(room => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${room.room_id}</td>
          <td>${room.item_count}</td>
          <td>${room.total_days}</td>
          <td>${room.point}</td>
        `;
        tbody.appendChild(row);
      });
    }

    // Load Fridge 1 by default when page opens
    loadRanking(1);

    // Reload whenever dropdown changes
    document.getElementById("fridgeSelect").addEventListener("change", (e) => {
      loadRanking(e.target.value);
    });
  </script>

</body>
</html>
